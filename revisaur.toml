output_dir = "site-dist"
data_dir = ".revisaur/data"
max_pull_requests = 2
skipped_authors = ["renovate", "renovate[bot]", "dependabot", "dependabot[bot]"]

[reviewer]
kind = "kiro"
command = "kiro-cli"
model = "claude-opus-4.7"
trust_tools = "read,grep,glob"
timeout_seconds = 900

[[repositories]]
name = "release-plz"
provider = "github"
url = "https://github.com/release-plz/release-plz"
max_pull_requests = 10

[[repositories]]
name = "gigi"
provider = "github"
url = "https://github.com/marcoieni/gigi"
max_pull_requests = 2

[[repositories]]
name = "revisaur"
provider = "github"
url = "https://github.com/marcoieni/revisaur"
max_pull_requests = 10
