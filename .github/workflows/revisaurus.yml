name: Revisaurus

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore Revisaurus state
        uses: actions/cache@v4
        with:
          path: .revisaurus/data
          key: revisaurus-state-${{ github.run_id }}
          restore-keys: |
            revisaurus-state-

      - name: Generate review site
        uses: marcoieni/revisaurus/action@main
        with:
          config: revisaurus.toml
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
