name: Revisaur

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: reviews
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore Revisaur state
        uses: actions/cache@v5
        with:
          path: .revisaur/data
          key: revisaur-state-${{ github.run_id }}
          restore-keys: |
            revisaur-state-

      - name: Generate review site
        uses: marcoieni/revisaur/action@main
        with:
          config: revisaur.toml
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
